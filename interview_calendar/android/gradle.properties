# Gradle 守护进程的内存上限。
#
# Flutter 模板默认给的是 -Xmx8G，对这台机器太激进了（总共 16GB 内存，
# 平时只剩 2-3GB 可用）。申请不到就会导致守护进程被系统杀掉，报
# 「Gradle build daemon disappeared unexpectedly」——而真正的原因
# （内存不足）在报错信息里完全看不出来，表现得像是随机的构建失败。
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# 让 Kotlin 在 Gradle 进程内编译，不再单独起一个编译守护进程。
# 默认会另起一个约 1.5-2GB 的 Kotlin daemon，在内存紧张的机器上
# 两个进程加起来很容易超过可用内存。代价是编译稍慢一点。
kotlin.compiler.execution.strategy=in-process

# 关掉 Gradle 的文件系统监视（VFS）。
# 构建会卡死在「刚开始执行」阶段：所有线程都在等待、没有任务在跑、
# 也不报错，就这么无限期挂着。在 Windows + Defender 实时防护的环境下，
# 文件监视是这类挂起的常见原因（尤其是跨盘符：项目在 D:，Flutter SDK 在 E:）。
# 代价是增量构建时不再靠文件变化跳过任务，会稍慢一点。
org.gradle.vfs.watch=false

android.useAndroidX=true
