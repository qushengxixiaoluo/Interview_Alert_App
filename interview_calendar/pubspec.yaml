name: interview_calendar
description: 事件日历 - 卡通风格日程管理
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  # 中文界面（日期/时间选择器等 Material 组件的本地化）
  flutter_localizations:
    sdk: flutter
  # 手机端用 sqflite（走系统自带的 SQLite，无需任何下载）。
  # 桌面端不用 sqflite_common_ffi：它会依赖 package:sqlite3，
  # 而后者在构建时要从 GitHub 下载预编译库 —— GitHub 在国内直连超时，
  # 会让安卓构建也一起失败（尽管安卓根本用不到它）。
  # 桌面端改用 JSON 文件存储，见 database_io.dart。
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  intl: ^0.20.2
  share_plus: ^10.1.4
  path: ^1.9.1
  url_launcher: ^6.3.1
  http: ^1.2.0
  shared_preferences: ^2.3.0
  # 浏览器 localStorage 访问（仅在 web 构建中用条件导入引入）
  web: ^1.1.0
  # 邮箱同步：IMAP 客户端。纯 Dart，不下载任何原生库（不会重演 sqlite3 的构建失败）。
  enough_mail: ^2.1.7
  # 授权码加密存储（Android Keystore / Windows DPAPI）
  # 固定在 10.x：11.x 需要 win32 ^6.0.1，会和 share_plus 10.1.4 需要的 win32 ^5.5.3 冲突
  flutter_secure_storage: ^10.3.4
  # 截图识别：从相册选图片（Android / Windows 官方支持，纯 Kotlin，构建期不下载任何东西）
  image_picker: ^1.1.2
  # 语音输入：调用本机系统语音识别（安卓自带 SpeechRecognizer，不走云端服务）。
  # 仅手机端可用，Windows 桌面端没有识别服务，按钮会自动禁用。
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
